<h2>Figma → Code Exporter</h2>
<p>File URL: <input id="FileUrl" type="text" placeholder="Enter file URL (Open in browser)"></p>
<button id="get-selection">Get Selection</button>
<script>

document.getElementById('get-selection').onclick = () => {
  parent.postMessage({ pluginMessage: { type: 'get-selection' } }, '*')
}

document.getElementById('FileUrl').onchange = (event) => {
  const fileUrl = event.target.value;
  parent.postMessage({ pluginMessage: { type: 'set-file-url', fileUrl } }, '*')
}


</script>
